[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-team-service"
version = "0.0.5.dev0"
description = "Optional shared status storage for Relay teams."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3", "python-socketio>=5.12,<6"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<0.29", "python-socketio[client]>=5.12,<6"]

[tool.setuptools.packages.find]
include = ["relay_team*"]
