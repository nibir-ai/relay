name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install build twine -e "./apps/agent[test]"
      - run: pnpm --dir apps/web test
      - run: python scripts/package.py
      - run: python -m pytest apps/agent/tests -q
      - run: python scripts/verify_package.py
      - run: python scripts/verify_clean_install.py
      - run: python scripts/verify_clean_install.py --minimum-dependencies
        if: matrix.python == '3.11'
      - run: python -m twine check dist/relay_backend-0.0.1*
