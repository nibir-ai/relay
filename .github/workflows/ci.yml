name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install build twine -e "./apps/agent[realtime,test]"
      - run: pnpm --dir apps/web test
      - run: python scripts/package.py
      - run: python -m pytest apps/agent/tests -q
      - run: python -m pip install -e "./apps/team-service[test]"
      - run: python -m pytest apps/team-service/tests -q
      - run: python -m build apps/team-service --outdir dist/team-service
      - run: python -m twine check dist/team-service/*
      - run: python -m venv .team-consumer
      - run: .team-consumer/bin/python -m pip install dist/team-service/*.whl
      - run: .team-consumer/bin/python scripts/verify_team_service.py
      - run: .team-consumer/bin/python -m pip install "dist/relay_backend-0.0.5-py3-none-any.whl[realtime]"
      - run: node scripts/package_node.cjs
      - run: .team-consumer/bin/python scripts/verify_realtime_integrations.py --require-installed
      - run: python scripts/verify_upgrades.py
        if: matrix.python == '3.12'
      - run: node scripts/verify_team_events.cjs
        env:
          RELAY_TEAM_PYTHON: ${{ github.workspace }}/.team-consumer/bin/python
      - run: python scripts/verify_package.py
      - run: python scripts/verify_clean_install.py
      - run: python scripts/verify_clean_install.py --minimum-dependencies
        if: matrix.python == '3.11'
      - run: python -m twine check dist/relay_backend-0.0.5*
