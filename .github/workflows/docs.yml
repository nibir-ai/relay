name: Verify documentation site
on:
  push:
    paths: ['website/**', 'docs/**', 'scripts/build_docs.py', 'scripts/verify_docs.py', 'apps/web/public/brand/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['website/**', 'docs/**', 'scripts/build_docs.py', 'scripts/verify_docs.py', 'apps/web/public/brand/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r website/requirements.txt
      - run: python scripts/build_docs.py
      - run: python scripts/verify_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test website/redirect/worker.test.mjs
      - run: node --test website/search.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: relay-documentation
          path: dist/docs
          retention-days: 7
