name: Publish v0.0.2
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    if: github.event.release.tag_name == 'v0.0.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install build twine -e "./apps/agent[test]"
      - run: pnpm --dir apps/web test
      - run: python scripts/package.py
      - run: python -m pytest apps/agent/tests -q
      - run: python scripts/verify_package.py
      - run: python scripts/verify_clean_install.py
      - run: python -m twine check dist/relay_backend-0.0.2*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/relay_backend-0.0.2*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/relay-backend
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
