name: Verify Node package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.13.0', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web test
      - run: node scripts/package_node.cjs
      - run: pnpm --dir packages/node test
      - run: pnpm --dir packages/node check:types
      - run: node scripts/verify_node_package.cjs
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24'
        with:
          name: node-distribution
          path: dist/relay-backend-*.tgz
