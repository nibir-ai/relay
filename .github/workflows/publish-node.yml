name: Publish Node package
on:
  push:
    tags: ['npm-v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'npm-v'+require('./packages/node/package.json').version) process.exit(1)"
      - run: pnpm --dir apps/web test
      - run: node scripts/package_node.cjs
      - run: pnpm --dir packages/node test
      - run: pnpm --dir packages/node check:types
      - run: node scripts/verify_node_package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: node-distribution
          path: dist/relay-backend-*.tgz
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v4
        with:
          name: node-distribution
          path: dist
      - run: npm publish dist/relay-backend-*.tgz --access public --provenance
