<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
<title id="title">Relay in your backend</title><desc id="desc">Install relay-backend in your backend environment. Import install_relay from relay_agent and call install_relay(app) on your FastAPI instance. Restart your backend and open /relay on its existing port. Copy the commands from the guide below.</desc>
<rect width="1400" height="440" fill="#10191d"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace"><text x="44" y="61" font-size="30" fill="#e4e7e9" font-weight="600">Relay in your backend</text><text x="44" y="122" font-size="22" fill="#67b0e8" font-weight="600">Install</text><text x="504" y="122" font-size="22" fill="#67b0e8" font-weight="600">Mount</text><text x="964" y="122" font-size="22" fill="#67b0e8" font-weight="600">Open</text><rect x="44" y="145" width="392" height="168" rx="4" fill="#192429" stroke="#3c4f59"/><path d="M44 187H436" stroke="#3c4f59" stroke-width="2"/><text x="62" y="172" font-size="16" fill="#b0bec4" font-weight="400">Terminal</text><text x="64" y="226" font-size="21" fill="#8ccf7e" font-weight="600">pip install relay-backend</text><text x="44" y="353" font-size="18" fill="#b0bec4" font-weight="400">Use your backend&#x27;s Python env</text><path d="M451 230H484" stroke="#67b0e8" stroke-width="2"/><path d="M477 224L484 230L477 236" fill="none" stroke="#67b0e8" stroke-width="2"/><rect x="504" y="145" width="412" height="168" rx="4" fill="#192429" stroke="#3c4f59"/><path d="M504 187H916" stroke="#3c4f59" stroke-width="2"/><text x="522" y="172" font-size="16" fill="#b0bec4" font-weight="400">Your FastAPI entry point</text><text x="524" y="219" font-size="17" fill="#67b0e8" font-weight="400">from relay_agent import install_relay</text><text x="524" y="272" font-size="23" fill="#8ccf7e" font-weight="600">install_relay(app)</text><text x="504" y="353" font-size="18" fill="#b0bec4" font-weight="400">Add the import and mount call</text><path d="M927 230H950" stroke="#67b0e8" stroke-width="2"/><path d="M943 224L950 230L943 236" fill="none" stroke="#67b0e8" stroke-width="2"/><rect x="964" y="145" width="392" height="168" rx="4" fill="#192429" stroke="#3c4f59"/><path d="M964 187H1356" stroke="#3c4f59" stroke-width="2"/><text x="982" y="172" font-size="16" fill="#b0bec4" font-weight="400">Your existing backend port</text><text x="985" y="216" font-size="23" fill="#b0bec4" font-weight="400">localhost:8000</text><text x="985" y="263" font-size="36" fill="#67b0e8" font-weight="600">/relay</text><text x="964" y="353" font-size="18" fill="#b0bec4" font-weight="400">Restart, then open in browser</text></g></svg>
