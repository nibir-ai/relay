<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
<title id="title">From request to shareable result</title><desc id="desc">Execute an endpoint, inspect or copy its response, and choose Export. Relay creates either an offline .relay browser report or structured JSON containing endpoint details, current request inputs and the latest captured response. Review exported bodies and responses before sharing; they can contain sensitive data.</desc>
<rect width="1400" height="440" fill="#10191d"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace"><text x="44" y="61" font-size="30" fill="#e4e7e9" font-weight="600">From request to shareable result</text><rect x="44" y="141" width="356" height="232" rx="4" fill="#192429" stroke="#3c4f59"/><path d="M44 183H400" stroke="#3c4f59" stroke-width="2"/><text x="62" y="168" font-size="16" fill="#b0bec4" font-weight="400">Run a request</text><rect x="64" y="207" width="72" height="30" rx="2" fill="#67b0e8" stroke="#67b0e8"/><text x="76" y="228" font-size="16" fill="#10191d" font-weight="700">GET</text><text x="153" y="230" font-size="23" fill="#e4e7e9" font-weight="400">/health</text><rect x="64" y="280" width="246" height="48" rx="4" fill="#67b0e8" stroke="#67b0e8"/><text x="89" y="311" font-size="20" fill="#10191d" font-weight="600">Execute request</text><path d="M415 256H470" stroke="#67b0e8" stroke-width="2"/><path d="M463 250L470 256L463 262" fill="none" stroke="#67b0e8" stroke-width="2"/><rect x="490" y="141" width="407" height="232" rx="4" fill="#192429" stroke="#3c4f59"/><path d="M490 183H897" stroke="#3c4f59" stroke-width="2"/><text x="508" y="168" font-size="16" fill="#b0bec4" font-weight="400">Inspect the response</text><text x="511" y="212" font-size="20" fill="#67b0e8" font-weight="400">Body   Raw   Headers</text><text x="511" y="264" font-size="22" fill="#e4e7e9" font-weight="400">Read · Copy · Focus</text><text x="511" y="316" font-size="25" fill="#8ccf7e" font-weight="600">Export</text><path d="M912 256H955" stroke="#67b0e8" stroke-width="2"/><path d="M948 250L955 256L948 262" fill="none" stroke="#67b0e8" stroke-width="2"/><text x="984" y="180" font-size="21" fill="#b0bec4" font-weight="400">Choose a format</text><rect x="984" y="201" width="372" height="68" rx="4" fill="#10191d" stroke="#3c4f59"/><text x="1006" y="243" font-size="26" fill="#67b0e8" font-weight="600">.relay</text><text x="1126" y="244" font-size="18" fill="#e4e7e9" font-weight="400">Browser report</text><rect x="984" y="286" width="372" height="68" rx="4" fill="#10191d" stroke="#3c4f59"/><text x="1006" y="329" font-size="26" fill="#8ccf7e" font-weight="600">.json</text><text x="1126" y="329" font-size="18" fill="#e4e7e9" font-weight="400">Structured data</text></g></svg>
