<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
<title id="title">One application. One port.</title><desc id="desc">Relay UI and its native request runner are mounted inside the existing FastAPI application. Relay discovers the app&#x27;s OpenAPI and executes through its middleware, dependencies and real handlers. The browser uses the backend&#x27;s existing port.</desc>
<rect width="1400" height="440" fill="#10191d"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace"><text x="44" y="61" font-size="30" fill="#e4e7e9" font-weight="600">One application. One port.</text><rect x="44" y="148" width="306" height="164" rx="4" fill="#192429" stroke="#3c4f59"/><path d="M44 190H350" stroke="#3c4f59" stroke-width="2"/><text x="62" y="175" font-size="16" fill="#b0bec4" font-weight="400">Browser</text><text x="66" y="220" font-size="34" fill="#67b0e8" font-weight="600">/relay</text><text x="66" y="266" font-size="20" fill="#e4e7e9" font-weight="400">Test your APIs</text><path d="M365 230H423" stroke="#67b0e8" stroke-width="2"/><path d="M416 224L423 230L416 236" fill="none" stroke="#67b0e8" stroke-width="2"/><rect x="444" y="109" width="912" height="273" rx="4" fill="#10191d" stroke="#3c4f59"/><text x="466" y="148" font-size="23" fill="#e4e7e9" font-weight="600">Your FastAPI application</text><text x="1114" y="148" font-size="20" fill="#8ccf7e" font-weight="400">Same port</text><rect x="467" y="177" width="257" height="157" rx="4" fill="#192429" stroke="#3c4f59"/><text x="487" y="214" font-size="24" fill="#67b0e8" font-weight="600">Relay UI</text><text x="487" y="249" font-size="18" fill="#b0bec4" font-weight="400">Bundled assets</text><text x="487" y="282" font-size="18" fill="#e4e7e9" font-weight="400">Request runner</text><path d="M739 258H875" stroke="#67b0e8" stroke-width="2"/><path d="M868 252L875 258L868 264" fill="none" stroke="#67b0e8" stroke-width="2"/><text x="748" y="233" font-size="17" fill="#8ccf7e" font-weight="400">Execute</text><rect x="892" y="177" width="440" height="157" rx="4" fill="#192429" stroke="#3c4f59"/><text x="912" y="215" font-size="24" fill="#8ccf7e" font-weight="600">Your API routes</text><text x="912" y="253" font-size="19" fill="#b0bec4" font-weight="400">Middleware + dependencies</text><text x="912" y="288" font-size="19" fill="#e4e7e9" font-weight="400">Real backend handlers</text><path d="M1112 334L1112 358" stroke="#67b0e8"