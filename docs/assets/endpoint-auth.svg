<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
<title id="title">Paste. Authorize. Execute.</title><desc id="desc">Use header Authorize for a shared bearer token. For a separate user or admin credential, click Auth beside that endpoint, paste its token and click Authorize. Advanced settings offers additional authentication modes. Routes in this diagram are examples; permissions are enforced by the backend.</desc>
<rect width="1400" height="460" fill="#10191d"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace"><text x="44" y="61" font-size="30" fill="#e4e7e9" font-weight="600">Paste. Authorize. Execute.</text><text x="44" y="119" font-size="18" fill="#b0bec4" font-weight="400">Example endpoints</text><rect x="44" y="145" width="588" height="58" rx="4" fill="#192429" stroke="#3c4f59"/><rect x="61" y="159" width="72" height="30" rx="2" fill="#67b0e8" stroke="#67b0e8"/><text x="73" y="180" font-size="16" fill="#10191d" font-weight="700">GET</text><text x="152" y="182" font-size="22" fill="#e4e7e9" font-weight="400">/profile</text><rect x="523" y="157" width="88" height="34" rx="4" fill="#10191d" stroke="#3c4f59"/><text x="543" y="181" font-size="18" fill="#67b0e8" font-weight="400">Auth</text><rect x="44" y="221" width="588" height="58" rx="4" fill="#192429" stroke="#3c4f59"/><rect x="61" y="235" width="72" height="30" rx="2" fill="#8ccf7e" stroke="#8ccf7e"/><text x="73" y="256" font-size="16" fill="#10191d" font-weight="700">POST</text><text x="152" y="258" font-size="22" fill="#e4e7e9" font-weight="400">/admin/users</text><rect x="523" y="233" width="88" height="34" rx="4" fill="#10191d" stroke="#3c4f59"/><text x="543" y="257" font-size="18" fill="#67b0e8" font-weight="400">Auth</text><text x="44" y="337" font-size="21" fill="#b0bec4" font-weight="400">Shared token: header Authorize</text><text x="44" y="372" font-size="21" fill="#e4e7e9" font-weight="400">Endpoint token: its Auth button</text><path d="M650 249H748" stroke="#67b0e8" stroke-width="2"/><path d="M741 243L748 249L741 255" fill="none" stroke="#67b0e8" stroke-width="2"/><rect x="770" y="136" width="586" height="256" rx="4" fill="#192429" stroke="#3c4f59"/><path d="M770 178H1356" stroke="#3c4f59" stroke-width="2"/><text x="788" y="163" font-size="16" fill="#b0bec4" font-weight="400">Quick endpoint authorization</text><text x="794" y="215" font-size="22" fill="#e4e7e9" font-weight="400">Paste token</text><rect x="794" y="235" width="538" height="48" rx="4" fill="#10191d" stroke="#3c4f59"/><text x="810" y="267" font-size="23" fill="#b0bec4" font-weight="400">••••••••••••••••••••</text><rect x="1140" y="309" width="192" height="48" rx="4" fill="#67b0e8" stroke="#67b0e8"/><text x="1164" y="340" font-size="21" fill="#10191d" font-weight="600">Authorize</text><text x="794" y="339" font-size="18" fill="#b0bec4" font-weight="400">Advanced settings</text></g></svg>
