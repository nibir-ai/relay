<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">Relay realtime setup</title><desc id="desc">Run one shared service, configure three private variables on each backend, then review Git statuses before importing.</desc>
<rect width="1120" height="520" rx="16" fill="#101a1e"/><g font-family="ui-monospace,Consolas,monospace"><text x="40" y="52" fill="#e5edef" font-size="24" font-weight="700">Team statuses. Local API testing.</text><text x="40" y="82" fill="#9eafb4" font-size="14">One shared destination. Your existing /relay workspace.</text>
<g stroke="#35494f" fill="#152329"><rect x="40" y="120" width="310" height="168" rx="8"/><rect x="405" y="120" width="310" height="168" rx="8"/><rect x="770" y="120" width="310" height="168" rx="8"/></g>
<g fill="#8ccf7e" font-size="12"><text x="60" y="148">01 / ADMINISTRATOR</text><text x="425" y="148">02 / EACH DEVELOPER</text><text x="790" y="148">03 / EXISTING /relay</text></g>
<g fill="#e5edef" font-size="18" font-weight="600"><text x="60" y="182">Run the shared service</text><text x="425" y="182">Set three variables</text><text x="790" y="182">Keep testing locally</text></g>
<g fill="#9eafb4" font-size="13"><text x="60" y="213">relay team init</text><text x="60" y="236">relay team add-member</text><text x="60" y="259">relay team serve</text><text x="425" y="213">RELAY_TEAM_URL</text><text x="425" y="236">RELAY_TEAM_PROJECT</text><text x="425" y="259">RELAY_TEAM_TOKEN</text><text x="790" y="213">Status + verified updater</text><text x="790" y="236">User / admin API auth</text><text x="790" y="259">Readable responses + exports</text></g>
<path d="M356 202h40m-8-6 8 6-8 6M721 202h40m-8-6 8 6-8 6" stroke="#67b0e8" fill="none" stroke-width="2"/>
<rect x="40" y="322" width="1040" height="154" rx="8" fill="#0d1519" stroke="#35494f"/>
<text x="60" y="353" fill="#67b0e8" font-size="12">MOVING FROM GIT?</text><text x="60" y="386" fill="#e5edef" font-size="18">Review preview &#8594; Select matching endpoints &#8594; Import selected</text><text x="60" y="417" fill="#9eafb4" font-size="13">Existing team statuses are preserved. Changed and removed endpoints are excluded.</text><text x="60" y="448" fill="#9eafb4" font-size="13">Git files stay intact. API tokens, requests, responses and notes stay local.</text>
</g></svg>